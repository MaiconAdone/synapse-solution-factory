name: synapse

networks:
  synapse:
    name: synapse-net

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: synapse-backend:local
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    networks:
      - synapse
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: synapse-frontend:local
    ports:
      - "3000:3000"
    networks:
      - synapse
    depends_on:
      - backend
    restart: unless-stopped
