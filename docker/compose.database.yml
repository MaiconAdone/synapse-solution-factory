services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "5432:5432"
    volumes:
      - synapse-postgres-data:/var/lib/postgresql/data
    networks:
      - synapse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://synapse:synapse@postgres:5432/synapse
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  synapse-postgres-data:
    name: synapse-postgres-data
