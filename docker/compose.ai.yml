services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - synapse-ollama-data:/root/.ollama
    networks:
      - synapse
    restart: unless-stopped

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  synapse-ollama-data:
    name: synapse-ollama-data
