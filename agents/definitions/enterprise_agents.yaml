version: 1
swarm:
  name: synapse-ai-swarm
  topology: hierarchical-mesh
  max_agents: 60
  core_agent_count: 15
  specialist_agent_count: 45
  activation_policy: cost_aware_core_subset_and_route_specialists_on_demand
  coordination: distributed
  consensus: majority
agents:
  - id: orchestration-manager
    tier: core
    domain: orchestration
    cognitive_pattern: systems
    memory: semantic
    mission: conduz dialogo sem codigo, aplica playbooks, aciona os 15 core agents e roteia especialistas sob demanda
  - id: product-strategy
    tier: core
    domain: product
    cognitive_pattern: strategic
    memory: semantic
    mission: traduz conversa em objetivo de negocio, metrica de sucesso e criterios de aceite
  - id: data-engineering
    tier: core
    domain: data
    cognitive_pattern: systems
    memory: semantic
    mission: organiza uploads, contrato de dados, validacao e linhagem
  - id: data-science
    tier: core
    domain: analytics
    cognitive_pattern: critical
    memory: semantic
    mission: analisa dados, estatistica, hipoteses, vieses e estrategia de features
  - id: machine-learning
    tier: core
    domain: ml
    cognitive_pattern: critical
    memory: semantic
    mission: define dados, baseline, metricas, treino, avaliacao e model card
  - id: llm-engineering
    tier: core
    domain: llm
    cognitive_pattern: adaptive
    memory: semantic
    mission: projeta prompts, ferramentas, guardrails e agentes de IA
  - id: rag-engineering
    tier: core
    domain: rag
    cognitive_pattern: systems
    memory: semantic
    mission: prepara ingestao, chunking, embeddings, indice e avaliacao de recuperacao
  - id: backend-engineering
    tier: core
    domain: backend
    cognitive_pattern: convergent
    memory: episodic
    mission: expoe APIs seguras para criacao, projetos, dados, modelos e agentes
  - id: frontend-engineering
    tier: core
    domain: frontend
    cognitive_pattern: convergent
    memory: episodic
    mission: mantem experiencia no-code com dialogo do usuario e resposta do LLM
  - id: integration-automation
    tier: core
    domain: integration
    cognitive_pattern: adaptive
    memory: episodic
    mission: conecta Codex, Ruflo, MCP, APIs, automacoes e ferramentas dos agentes
  - id: security-compliance
    tier: core
    domain: security
    cognitive_pattern: critical
    memory: semantic
    mission: define autenticacao, permissoes, privacidade, LGPD, limites de autonomia e policies
  - id: observability-ops
    tier: core
