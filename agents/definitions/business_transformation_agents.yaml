version: 1
workflow: business-transformation
execution: swarm-governed
profiles:
  - id: orchestrator
    class: OrchestratorAgent
    agent_id: orchestration-manager
    tools: []
  - id: business-transformation
    class: BusinessTransformationAgent
    agent_id: product-strategy
    tools: [kpi_tool]
  - id: process-mapping
    class: ProcessMappingAgent
    agent_id: business-value-analyst
    tools: [process_tool]
  - id: data-analysis
    class: DataAnalysisAgent
    agent_id: data-science
    tools: [data_tool]
  - id: automation-architect
    class: AutomationArchitectAgent
    agent_id: integration-automation
    tools: [automation_tool]
  - id: kpi-monitor
    class: KPIMonitorAgent
    agent_id: metrics-instrumentation
    tools: [kpi_tool]
  - id: risk-governance
    class: RiskGovernanceAgent
    agent_id: security-compliance
    tools: []
  - id: human-approval
    class: HumanApprovalAgent
    agent_id: policy-guardrails-engineer
    tools: []
