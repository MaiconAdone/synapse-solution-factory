version: 2
workflow: business-transformation
execution: role-based
source_of_truth: config/business_transformation.json
roles: config/roles.json
profiles:
  - id: orchestrator
    class: OrchestratorAgent
    role: orchestration-manager
    tools: []
    stages: [intake, execution_planning, final_report]
  - id: business-transformation
    class: BusinessTransformationAgent
    role: product-strategy
    tools: [kpi_tool]
    stages: [diagnosis, opportunity_identification, prioritization]
  - id: process-mapping
    class: ProcessMappingAgent
    role: business-value-analyst
    tools: [process_tool]
    stages: [process_mapping]
  - id: data-analysis
    class: DataAnalysisAgent
    role: data-science
    tools: [data_tool]
    stages: [data_readiness]
  - id: automation-architect
    class: AutomationArchitectAgent
    role: integration-automation
    tools: [automation_tool]
    stages: [automation_architecture, simulation]
  - id: kpi-monitor
    class: KPIMonitorAgent
    role: metrics-instrumentation
    tools: [kpi_tool]
    stages: [kpi_design, impact_evaluation]
  - id: risk-governance
    class: RiskGovernanceAgent
    role: security-compliance
    tools: []
    stages: [risk_governance]
  - id: human-approval
    class: HumanApprovalAgent
    role: policy-guardrails-engineer
    tools: []
    stages: [human_approval]
