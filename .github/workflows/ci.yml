name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate enterprise stack
        shell: pwsh
        run: ./scripts/validate_enterprise_stack.ps1
      - name: Run tests
        shell: pwsh
        run: python -m pytest tests
