name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate enterprise stack
        shell: pwsh
        run: ./scripts/validate_enterprise_stack.ps1
      - name: Run backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="backend"
          python -m pytest tests

  adonex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: adonex/package-lock.json
      - name: Install AdoneX dependencies
        working-directory: adonex
        run: npm ci
      - name: Compile AdoneX
        working-directory: adonex
        run: npm run compile
      - name: Run AdoneX unit tests
        working-directory: adonex
        run: npm run test:unit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
