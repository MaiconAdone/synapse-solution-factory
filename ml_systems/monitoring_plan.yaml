version: 1
implementation: scripts/synapse_lib/drift.py
command: python scripts/synapse_ci.py drift --reference <treino.csv> --current <producao.csv>
thresholds:
  metric: population_stability_index
  psi_drift: 0.2
  psi_warning: 0.1
signals:
  data_drift:
    enabled: true
  prediction_drift:
    enabled: true
  business_metric_drift:
    enabled: true
  latency:
    enabled: true
  error_rate:
    enabled: true
actions:
  alert_owner: orchestration-manager
  retraining_trigger: approved_data_or_model_drift_threshold_breach
  rollback_trigger: approved_quality_safety_or_business_metric_regression
