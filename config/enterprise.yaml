project:
  name: synapse-ai
  type: enterprise-ai-ml-saas
  core: codex-claude
agent_governance:
  roles: config/roles.json
  policy: config/harness_engineering_policy.json
  execution: single_assistant_first
memory:
  enabled: true
  namespace: synapse-ai
  persist_on_create: true
  runtime_file: memory/project_memory.runtime.json
  backend: hybrid
  tiers:
    - working
    - episodic
    - semantic
  embeddings:
    enabled: true
    dimension: 384
  semantic_search:
    enabled: true
    index: hnsw-ready
rag:
  vector_db_path: vector_db
  pipeline:
    - ingest
    - normalize
    - chunk
    - embed
    - index
    - retrieve
    - rerank
    - cite
