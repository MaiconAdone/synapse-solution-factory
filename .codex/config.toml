# Codex project configuration - recovery profile
# Governance source of truth: config/llm_solution_factory_policy.json
# canais autorizados para conteudo solicitado pelo usuario: Codex chat, Claude Code chat/terminal, AdoneX chat participant e VS Code Chat.
# Se faltar contexto obrigatorio da Solution Factory, pergunte ao usuario antes de implementar.
# Codex usa OpenAI diretamente e nao registra ferramentas Ollama.
# Ollama e reservado ao AdoneX.
# Root keys MUST come before TOML tables.
# Operario oficial do Claude Code neste projeto: GPT 5.5 via plugin codex@openai-codex.
model = "gpt-5.5"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

